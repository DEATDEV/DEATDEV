<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" role="img" aria-label="Currently working on" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="798" height="228" rx="16" fill="#0d1117" stroke="#30363d"/>

  <circle cx="40" cy="42" r="5" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="58" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Currently working on</text>

  <!-- row 1 -->
  <text x="40" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#c9d1d9">2.5D Lidar Mapping</text>
  <rect x="250" y="87" width="440" height="14" rx="7" fill="#1f2937"/>
  <rect x="250" y="87" width="0" height="14" rx="7" fill="url(#accent)">
    <animate attributeName="width" from="0" to="264" dur="1.6s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="710" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">60%</text>

  <!-- row 2 -->
  <text x="40" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#c9d1d9">ROS 2</text>
  <rect x="250" y="137" width="440" height="14" rx="7" fill="#1f2937"/>
  <rect x="250" y="137" width="0" height="14" rx="7" fill="url(#accent)">
    <animate attributeName="width" from="0" to="176" dur="1.6s" begin="0.5s" fill="freeze"/>
  </rect>
  <text x="710" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">40%</text>

  <!-- row 3 -->
  <text x="40" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#c9d1d9">A* Algorithm</text>
  <rect x="250" y="187" width="440" height="14" rx="7" fill="#1f2937"/>
  <rect x="250" y="187" width="0" height="14" rx="7" fill="url(#accent)">
    <animate attributeName="width" from="0" to="220" dur="1.6s" begin="0.8s" fill="freeze"/>
  </rect>
  <text x="710" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">50%</text>
</svg>
