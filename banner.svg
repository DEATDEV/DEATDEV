<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Debarpan Roy - Frontend Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#16324f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>

  <!-- floating particles -->
  <g fill="#36BCF7">
    <circle cx="120" cy="40" r="2" opacity="0.5"><animate attributeName="cy" values="40;20;40" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="225" r="2" opacity="0.4"><animate attributeName="cy" values="225;240;225" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="45" r="2.5" opacity="0.5"><animate attributeName="cy" values="45;30;45" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="215" r="2" opacity="0.4"><animate attributeName="cy" values="215;200;215" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- lidar radar -->
  <circle cx="980" cy="130" r="40" fill="none" stroke="#36BCF7" stroke-opacity="0.30"/>
  <circle cx="980" cy="130" r="80" fill="none" stroke="#36BCF7" stroke-opacity="0.22"/>
  <circle cx="980" cy="130" r="120" fill="none" stroke="#36BCF7" stroke-opacity="0.15">
    <animate attributeName="r" values="120;128;120" dur="4s" repeatCount="indefinite"/>
  </circle>
  <line x1="840" y1="130" x2="1120" y2="130" stroke="#36BCF7" stroke-opacity="0.15"/>
  <line x1="980" y1="-10" x2="980" y2="270" stroke="#36BCF7" stroke-opacity="0.15"/>
  <path d="M980 130 L1100 130 A120 120 0 0 0 1083.9 70 Z" fill="url(#accent)" fill-opacity="0.35">
    <animateTransform attributeName="transform" type="rotate" from="0 980 130" to="360 980 130" dur="6s" repeatCount="indefinite"/>
  </path>
  <circle cx="1030" cy="95" r="4" fill="#36BCF7"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="935" cy="170" r="3" fill="#7C5CFF"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="1060" cy="160" r="3" fill="#36BCF7"><animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite"/></circle>

  <!-- text (fades and slides in) -->
  <text x="70" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="6" fill="#36BCF7" opacity="0">HELLO, I'M
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.1s" fill="freeze"/>
  </text>
  <text x="70" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff" opacity="0">Debarpan Roy
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.4s" fill="freeze"/>
    <animate attributeName="x" from="40" to="70" dur="0.9s" begin="0.4s" fill="freeze"/>
  </text>
  <text x="70" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#9fb3c8" opacity="0">Frontend Developer  ·  Robotics &amp; Lidar Mapping
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.9s" fill="freeze"/>
  </text>
  <rect x="70" y="212" width="0" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="0;130;130;0" keyTimes="0;0.2;0.8;1" dur="5s" begin="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
